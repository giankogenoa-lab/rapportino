<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapportino</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="paginaInserimento">

        <h1>Rapportino</h1>

        <h2>Richiedente</h2>

        <label for="dataRiferimento">
            Data di riferimento *
        </label>

        <input
            type="text"
            id="dataRiferimento"
            placeholder="01.01.2026">

        <label for="cognomeRichiedente">
            Richiedente *
        </label>

        <input
            type="text"
            id="cognomeRichiedente"
            list="listaAgenti">

        <datalist id="listaAgenti"></datalist>

        <label for="nomeRichiedente">
            Nome
        </label>

        <input
            type="text"
            id="nomeRichiedente"
            readonly>

        <label for="cidRichiedente">
            CID
        </label>

        <input
            type="text"
            id="cidRichiedente"
            readonly>

        <hr>

        <h2>Agenti</h2>

        <button
            id="aggiungiAgente"
            type="button">

            + Aggiungi agente

        </button>

        <br><br>

        <div id="contenitoreAgenti"></div>

        <hr>

        <label for="note">
            Note *
        </label>

        <textarea
            id="note"
            rows="8"></textarea>

        <br><br>

        <button
            id="rivedi"
            type="button">

            Rivedi

        </button>

    </div>

    <div id="paginaRiepilogo" class="nascosto">

        <h1>Riepilogo Rapportino</h1>

        <div id="contenutoRiepilogo"></div>

        <br>

        <button
            id="modifica"
            type="button">

            Modifica

        </button>

        <button
            id="salvaInvia"
            type="button">

            Salva e Invia

        </button>

    </div>

    <div id="paginaCompletata" class="nascosto">

    <h1>Grazie</h1>

    <p>
        Il rapportino è stato registrato correttamente.
    </p>

    <button
        id="nuovoRapportino"
        type="button">

        Nuovo Rapportino

    </button>

</div>

    <script src="app.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapportino</title>

    style.css
</head>

<body>

    <h1>Rapportino</h1>

    <h2>Richiedente</h2>

    <label>Data di riferimento *</label>
    <input type="text" id="dataRiferimento">

    <label>Cognome richiedente *</label>
    <input type="text" id="cognomeRichiedente">

    <label>Nome</label>
    <input type="text" id="nomeRichiedente" readonly>

    <label>CID</label>
    <input type="text" id="cidRichiedente" readonly>

    <hr>

    <h2>Agenti</h2>

    <button id="aggiungiAgente" type="button">
        + Aggiungi agente
    </button>

    <div id="contenitoreAgenti"></div>

    <hr>

    <label>Note *</label>
    <textarea id="note" rows="6"></textarea>

    <br><br>

    <button id="rivedi" type="button">
        Rivedi
    </button>

    <div id="riepilogo"></div>

    app.jsscript>

</body>
</html>
